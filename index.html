<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: one column on the outer screen, in portrait or landscape; on the
   unfolded inner screen (720px wide and 540px tall or more) a feed sidebar
   sits beside the article list. */
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --fg: #141922;
  --muted: #5b6575;
  --line: #e1e5ec;
  --accent: #2252d1; --star: #d99a00;
  --accent-soft: #e6edfc;
  --danger: #b4232c;
  --read: #8a93a2;
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-title: "Newsreader", "New York", Georgia, "Times New Roman", serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --surface: #151a22; --fg: #e7ebf2; --muted: #9aa4b3; --line: #252c38;
    --accent: #7ea4ff; --star: #ffc53d; --accent-soft: #1c2740; --danger: #ff7a80; --read: #6c7585;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #151a22; --fg: #e7ebf2; --muted: #9aa4b3; --line: #252c38;
  --accent: #7ea4ff; --star: #ffc53d; --accent-soft: #1c2740; --danger: #ff7a80; --read: #6c7585;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.4 var(--f-ui); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* iPhone Duo outer screen: iOS keeps a column on the right for its clock and
   lays web apps out beside it. The script takes that column back (--col is its
   width); text runs into it, buttons stay out of it. */
:root { --col: 0px; }
:root.cover .bar, :root.cover .tools { padding-right: calc(16px + var(--col)); }
:root.cover .art-bar { padding-right: calc(8px + var(--col)); }
:root.cover .sheet { padding-right: calc(16px + var(--col)); }
:root.cover .item { grid-template-columns: 14px 1fr; position: relative; }
:root.cover .item .meta { padding-right: calc(var(--col) + 52px); }
:root.cover .item .meta { padding-right: calc(var(--col) + 84px); }
:root.cover .acts { position: absolute; top: 2px; right: calc(var(--col) + 6px); flex-direction: row; align-items: center; }
:root.cover .toggle { padding: 3px 8px; }

.app { display: flex; height: 100%; }

/* Sidebar (feeds) */
.side {
  display: none; flex-direction: column; width: 300px; flex: none;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: calc(var(--sat) + 12px) 12px calc(var(--sab) + 12px) max(12px, var(--sal));
  overflow-y: auto;
}
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }

.bar {
  display: flex; align-items: center; gap: 8px;
  padding: calc(var(--sat) + 10px) max(16px, var(--sar)) 10px max(16px, var(--sal));
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar h1 { flex: 1; min-width: 0; margin: 0; font: 600 26px/1.1 var(--f-title); letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent;
  display: inline-grid; place-items: center; color: var(--accent);
}
.icon-btn:active { background: var(--accent-soft); }
.icon-btn svg { width: 22px; height: 22px; }
.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.tools {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px max(16px, var(--sar)) 10px max(16px, var(--sal));
}
.seg { display: inline-flex; background: var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.tools .spacer { flex: 1; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: 14px; font-weight: 500; padding: 6px 2px; }
.status { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.scroller { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
.pull { height: 0; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; transition: height 0.2s; }

.list { list-style: none; margin: 0; padding: 0 0 calc(var(--sab) + 24px); }
.item {
  display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 10px; align-items: start;
  padding: 12px max(16px, var(--sar)) 12px max(12px, var(--sal));
  border-bottom: 1px solid var(--line);
}
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--accent); justify-self: center; }
.item.read .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.item a { color: inherit; text-decoration: none; min-width: 0; display: block; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; min-width: 0; }
.meta .src { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .time { flex: none; font-variant-numeric: tabular-nums; }
.item h2 { margin: 2px 0 0; font: 600 17px/1.28 var(--f-title); text-wrap: pretty; }
.item p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item.read h2 { color: var(--read); font-weight: 500; }
.toggle { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 4px 0 4px 6px; white-space: nowrap; }
.acts { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.star { border: 0; background: none; color: var(--muted); padding: 4px 0 4px 8px; display: inline-grid; }
.star svg { width: 20px; height: 20px; fill: none; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.art-bar .star { padding: 8px; }
.seg button.seg-star { padding: 5px 10px; display: inline-grid; place-items: center; }
.seg-star svg { width: 16px; height: 16px; fill: none; }
.seg-star[aria-pressed="true"] { color: var(--star) !important; }
.seg-star[aria-pressed="true"] svg { fill: currentColor; }

.empty { padding: 48px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 17px; margin-bottom: 6px; }

/* Feeds panel: sheet on narrow screens, sidebar on wide ones */
.feeds h3 { margin: 4px 4px 10px; font: 600 22px/1.2 var(--f-title); }
.feed-list { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.feed-row { display: flex; align-items: center; gap: 6px; border-radius: 10px; }
.feed-row.active { background: var(--accent-soft); }
.feed-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 9px 8px; border-radius: 10px; }
.feed-pick .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.feed-pick .err { color: var(--danger); font-size: 12px; }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.remove { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 8px; border-radius: 8px; white-space: nowrap; }
.remove.confirm { color: #fff; background: var(--danger); }
.add { display: flex; gap: 8px; padding: 0 4px; }
.add input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.add button { height: 42px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .add button { color: #0d1015; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .add button { color: #0d1015; } }
.hint { margin: 8px 4px 0; font-size: 12px; color: var(--muted); }
.hint.bad { color: var(--danger); }
.sync { margin-top: 26px; }
.sync .link-btn { margin: 6px 4px 0; }

.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / 0.35); display: flex; align-items: flex-end; }
.sheet {
  width: 100%; max-height: 88%; overflow-y: auto; background: var(--surface);
  border-radius: 16px 16px 0 0; padding: 16px max(16px, var(--sar)) calc(var(--sab) + 20px) max(16px, var(--sal));
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head .link-btn { font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 18px); transform: translateX(-50%); z-index: 30;
  background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); }

/* Article view: covers the list pane (full screen when folded). Swipe sideways
   for the next or previous article; vertical scrolling stays native. */
.main { position: relative; }
.art { position: absolute; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.art-bar { display: flex; align-items: center; gap: 4px;
  padding: calc(var(--sat) + 6px) max(8px, var(--sar)) 6px max(8px, var(--sal)); border-bottom: 1px solid var(--line); }
.art-bar .back { border: 0; background: none; color: var(--accent); font-weight: 500; padding: 8px 6px; display: inline-flex; align-items: center; gap: 2px; }
.art-bar .back svg { width: 20px; height: 20px; }
.art-bar .pos { flex: 1; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.art-bar .icon-btn:disabled { color: var(--line); }
.art-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
.art-scroll.dragging { -webkit-user-select: none; user-select: none; }
/* While an article is open, a sideways drag anywhere on the screen is a swipe,
   including blank space below the article or outside the app's box. */
:root.reading, :root.reading body, .art { touch-action: pan-y; }
.art-card { min-height: 100%; }
.art-card { padding: 18px max(20px, var(--sar)) calc(var(--sab) + 40px) max(20px, var(--sal)); max-width: 680px; margin: 0 auto; will-change: transform; }
.art-card .meta { font-size: 13px; }
.art-card h1 { margin: 6px 0 14px; font: 600 26px/1.2 var(--f-title); letter-spacing: -0.01em; text-wrap: pretty; }
.art-body { font-size: 17px; line-height: 1.55; overflow-wrap: anywhere; }
.art-body img, .art-body video, .art-body iframe { max-width: 100%; height: auto; border-radius: 8px; }
.art-body a { color: var(--accent); }
.art-body blockquote { margin: 1em 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
.art-body pre { overflow-x: auto; font-size: 14px; }
.art-open { display: block; margin-top: 24px; text-align: center; padding: 12px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; text-decoration: none; }
.art-hint { margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted); }
.art-edge { position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none; opacity: 0; transition: opacity 0.15s; }

#sideBtn { display: none; margin-left: -8px; }
@media (min-width: 720px) and (min-height: 540px) {
  .side { display: flex; }
  #sideBtn { display: inline-grid; }
  :root.noside .side { display: none; }
  #feedsBtn { display: none; }
  .sheet-wrap { display: none !important; }
  .item { padding-left: 16px; }
  .item h2 { font-size: 18px; }
}
@media (min-width: 1000px) and (min-height: 540px) { .side { width: 330px; } }
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } .pull, .art-card { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side feeds" id="side" aria-label="Feeds"></aside>
  <main class="main">
    <header class="bar">
      <button class="icon-btn" id="sideBtn" aria-label="Hide feeds" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <h1 id="heading">All articles</h1>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" id="feedsBtn" aria-label="Feeds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
    </header>
    <div class="tools">
      <div class="seg" role="group" aria-label="Show">
        <button id="fAll" aria-pressed="true">All</button>
        <button id="fUnread" aria-pressed="false">Unread</button>
        <button id="fStar" class="seg-star" aria-pressed="false" aria-label="Starred"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button>
      </div>
      <span class="status" id="status"></span>
      <span class="spacer"></span>
      <button class="link-btn" id="markAll">Mark all read</button>
    </div>
    <div class="scroller" id="scroller">
      <div class="pull" id="pull">Pull to refresh</div>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden></div>
    </div>
    <section class="art" id="art" hidden aria-label="Article">
      <div class="art-bar">
        <button class="back" id="artBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Articles</button>
        <span class="pos" id="artPos"></span>
        <button class="star" id="artStar" aria-pressed="false" aria-label="Star"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button>
        <button class="icon-btn" id="artPrev" aria-label="Previous article"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="icon-btn" id="artNext" aria-label="Next article"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div class="art-scroll" id="artScroll"><article class="art-card" id="artCard"></article></div>
    </section>
  </main>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet feeds" id="sheet" role="dialog" aria-label="Feeds"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
  // iPhone Duo outer screen: take back the column iOS keeps for its clock, so
  // the app fills the whole screen. Re-checked when the screen changes (fold).
  (function coverColumn() {
    const meta = document.querySelector('meta[name="viewport"]'), root = document.documentElement;
    const BASE = "width=device-width, initial-scale=1, viewport-fit=cover";
    const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
    if (!meta || !standalone) return;
    const probe = document.createElement("div");
    probe.style.cssText = "position:fixed;left:0;top:0;height:0;visibility:hidden;pointer-events:none;width:env(safe-area-inset-right,0px)";
    document.documentElement.appendChild(probe);
    let key = "", timer = 0;
    const geo = () => screen.width + "x" + screen.height + ":" + (innerHeight > innerWidth);
    function measure() {
      const sw = screen.width, w = root.clientWidth, h = root.clientHeight, col = sw - w;
      if (sw <= 600 && h > w && col > 0 && col <= 120 && probe.getBoundingClientRect().width === 0) {
        meta.content = "width=" + sw + ", height=" + h + ", initial-scale=1, viewport-fit=cover";
        root.style.setProperty("--col", col + "px"); root.classList.add("cover");
      }
    }
    function sync() {
      key = geo();
      meta.content = BASE; root.style.removeProperty("--col"); root.classList.remove("cover");
      requestAnimationFrame(() => requestAnimationFrame(measure));
    }
    // iOS can add the clock column a moment after launch or on return to the
    // app, without the screen itself changing, so check again whenever the
    // size changes and a few times after starting.
    const recheck = () => { if (geo() !== key) sync(); else if (!root.classList.contains("cover")) requestAnimationFrame(measure); };
    const onResize = () => { clearTimeout(timer); timer = setTimeout(recheck, 150); };
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { recheck(); setTimeout(recheck, 600); } });
    [400, 1200, 3000].forEach(ms => setTimeout(recheck, ms));
    addEventListener("resize", onResize);
    if (window.visualViewport) visualViewport.addEventListener("resize", onResize);
    addEventListener("pageshow", e => { if (e.persisted) sync(); });
    sync();
  })();
(() => {
  "use strict";
  const SEED = [
    { url: "https://feeds.bbci.co.uk/news/rss.xml", title: "BBC News" },
    { url: "https://feeds.npr.org/1001/rss.xml", title: "NPR News" },
  ];
  const KEEP_PER_FEED = 60;
  const STALE_MS = 10 * 60 * 1000;

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("rr." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("rr." + k, JSON.stringify(v)); } catch {} if (k === "read" || k === "stars") syncSoon(); },
  };
  let feeds = store.get("feeds", null);
  if (!Array.isArray(feeds)) { feeds = SEED.map(f => ({ id: hash(f.url), url: f.url, title: f.title })); store.set("feeds", feeds); }
  let items = store.get("items", {});          // feedId -> [item]
  let read = store.get("read", {});            // itemId -> ts
  let tomb = store.get("tomb", {});            // itemId -> ts it was marked unread (so sync doesn't bring it back)
  let stars = store.get("stars", {});          // itemId -> { ts starred, it: the article, kept after it leaves its feed }
  let starTomb = store.get("starTomb", {});    // itemId -> ts it was unstarred
  let feedSync = store.get("feedSync", {});    // feedKey -> { u, t, ts }: ts > 0 added, < 0 removed
  let syncMsg = "", syncT = null, syncing = null, syncQuiet = false, syncAgain = false;
  let lastRefresh = store.get("lastRefresh", 0);
  let filter = store.get("filter", "all");
  let selected = "all";                        // feed id or "all"
  let busy = false;
  let pendingRemove = null;

  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- fetching ----------
  function withTimeout(ms) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return { signal: c.signal, done: () => clearTimeout(t) }; }
  async function getText(url, ms = 12000) {
    const t = withTimeout(ms);
    try {
      const r = await fetch(url, { signal: t.signal, cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.text();
    } finally { t.done(); }
  }
  const RELAYS = [
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u),
  ];

  function textOf(html) {
    if (!html) return "";
    const doc = new DOMParser().parseFromString(html, "text/html");
    let t = (doc.body?.textContent || "").replace(/\s+/g, " ").trim();
    if (!t) { const img = doc.querySelector("img[title], img[alt]"); if (img) t = (img.getAttribute("title") || img.getAttribute("alt") || "").trim(); }
    return t;

  const clip = (s, n) => s.length <= n ? s : s.slice(0, n).replace(/\s+\S*$/, "") + "…";

      if (!view || e.pointerId !== pid || mode === "skip" || mode === "y" || (e.pointerType === "mouse" && !(e.buttons & 1))) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if (!mode) {
        if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
        mode = Math.abs(mx) > Math.abs(my) * 1.2 ? "x" : "y";
        if (mode === "y") return;
        dragged = true; area.classList.add("dragging");
        try { area.setPointerCapture(pid); } catch {}
      }
      dx = mx;
      const atEnd = (dx > 0 && view.idx <= 0) || (dx < 0 && view.idx >= view.ids.length - 1);
      card.style.transition = "none";
      card.style.transform = `translateX(${atEnd ? dx * 0.3 : dx}px)`;
    });
    const end = e => {
      if (e.pointerId !== pid) return;
      pid = null; area.classList.remove("dragging");
      if (mode !== "x") { mode = null; return; }
      mode = null;
      const w = area.clientWidth, fast = Math.abs(dx) > 40 && Date.now() - st < 300;
      if (e.type === "pointerup" && (Math.abs(dx) > w * 0.22 || fast) && go(dx < 0 ? 1 : -1)) return;
      card.style.transition = "transform 0.2s ease-out"; card.style.transform = "translateX(0)";
    };
    document.addEventListener("pointerup", end);
    document.addEventListener("pointercancel", end);
    // A drag isn't a tap: don't follow a link the swipe started on.
    area.addEventListener("click", e => { if (dragged) { e.preventDefault(); e.stopPropagation(); dragged = false; } }, true);
    area.addEventListener("dragstart", e => e.preventDefault());
  }

  // pull to refresh
  const sc = $("scroller"), pull = $("pull");
  let startY = null, dist = 0;
  sc.addEventListener("touchstart", e => { startY = sc.scrollTop <= 0 ? e.touches[0].clientY : null; dist = 0; }, { passive: true });
  sc.addEventListener("touchmove", e => {
    if (startY == null) return;
    dist = Math.max(0, e.touches[0].clientY - startY);
    const h = Math.min(70, dist * 0.5);
    pull.style.transition = "none"; pull.style.height = h + "px";
    pull.textContent = h >= 56 ? "Release to refresh" : "Pull to refresh";
  }, { passive: true });
  sc.addEventListener("touchend", () => {
    if (startY == null) return;
    pull.style.transition = ""; const go = dist * 0.5 >= 56;
    pull.style.height = "0px"; startY = null;
    if (go) refresh(true);
  });

  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastRefresh > STALE_MS) refresh(false); });
  setInterval(() => { if (!busy) statusLine(); }, 60000);

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

  render();
  if (syncToken()) syncNow();
  if (Date.now() - lastRefresh > STALE_MS || !Object.keys(items).length) refresh(false);
})();
</script>
</body>
</html>
