name: Fetch feeds

# GitHub starts scheduled runs hours late, so one run keeps going: it fetches
# every 20 minutes for about 5 hours, then starts the next run itself. The
# hourly schedule only restarts the chain if it ever stops: a scheduled run
# ends at once when another run is going. A newer run (a push, a manual
# start) takes over; the older one ends at its next round.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [feeds.txt, .github/scripts/fetch_feeds.py, .github/scripts/push_badge.py, .github/scripts/webpush.mjs, .github/workflows/feeds.yml]

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Get the last copies
        run: |
          mkdir -p prev
          if git fetch -q --depth=1 origin data; then git archive FETCH_HEAD | tar -x -C prev; fi
      - name: Fetch feeds every 20 minutes
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ME: ${{ github.run_number }}
        run: |
          # Run numbers of the other runs of this workflow that are still going.
          others() {
            gh run list --workflow feeds.yml --limit 20 --json number,status \
              --jq '.[] | select(.status != "completed") | .number' 2>/dev/null | grep -vx "$ME" || true
          }
          if [ "${{ github.event_name }}" = schedule ] && [ -n "$(others)" ]; then
            echo "Another run is fetching; nothing to do."; exit 0
          fi
          end=$(( $(date +%s) + 5*3600 ))
          while :; do
            for n in $(others); do
              if [ "$n" -gt "$ME" ]; then echo "Run $n took over."; exit 0; fi
            done
            start=$(date +%s)
            rm -rf out
            if python3 .github/scripts/fetch_feeds.py feeds.txt prev out; then
              python3 .github/scripts/push_badge.py out || echo "push step failed"
              (
                cd out
                git init -q -b data
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -qm "Feeds $(date -u +%FT%TZ)"
                git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" data
              ) || echo "publish failed"
              rm -rf prev out/.git && mv out prev
            else
              echo "fetch failed"
            fi
            if [ $(( start + 1200 )) -ge $end ]; then break; fi
            wait=$(( start + 1200 - $(date +%s) ))
            if [ $wait -gt 0 ]; then sleep $wait; fi
          done
          gh workflow run feeds.yml --ref main
